<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Меблі Store</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f5f5f5;
}

header {
  background: #222;
  color: white;
  padding: 15px;
  text-align: center;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  text-align: center;
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.price {
  color: green;
  font-size: 18px;
}

button {
  margin: 5px;
  padding: 10px;
  border: none;
  background: #ff6600;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

button:hover {
  background: #cc5200;
}

.cart {
  background: white;
  margin: 20px;
  padding: 15px;
  border-radius: 10px;
}

input {
  padding: 8px;
  margin: 5px;
  width: 90%;
}

footer {
  background: #222;
  color: white;
  text-align: center;
  padding: 10px;
}
</style>
</head>

<body>

<header>
  <h1>🛋️ Меблі Store</h1>
  <p>Інтернет-магазин меблів</p>
</header>

<div class="container">

  <div class="card">
    <img src="https://via.placeholder.com/300x200">
    <h3>Диван Modern</h3>
    <p class="price">12000 грн</p>
    <button onclick="addToCart('Диван Modern',12000)">В корзину</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x200">
    <h3>Крісло Comfort</h3>
    <p class="price">4500 грн</p>
    <button onclick="addToCart('Крісло Comfort',4500)">В корзину</button>
  </div>

  <div class="card">
    <img src="https://via.placeholder.com/300x200">
    <h3>Стіл Wood</h3>
    <p class="price">6800 грн</p>
    <button onclick="addToCart('Стіл Wood',6800)">В корзину</button>
  </div>

</div>

<div class="cart">
  <h2>🛒 Корзина</h2>
  <ul id="cartList"></ul>
  <h3>Сума: <span id="total">0</span> грн</h3>

  <h3>Оформити замовлення</h3>
  <input type="text" id="name" placeholder="Ваше ім’я">
  <input type="text" id="phone" placeholder="Телефон">

  <button onclick="checkout()">Замовити</button>

  <br><br>
  <a href="https://t.me/your_username" target="_blank">
    <button style="background:#0088cc;">Написати в Telegram</button>
  </a>
</div>

<footer>
  <p>📞 Контакти: +380962321849</p>
</footer>

<script>
let cart = [];
let total = 0;

function addToCart(name, price) {
  cart.push({name, price});
  total += price;
  renderCart();
}

function renderCart() {
  let list = document.getElementById("cartList");
  list.innerHTML = "";
  cart.forEach(item => {
    let li = document.createElement("li");
    li.innerText = item.name + " - " + item.price + " грн";
    list.appendChild(li);
  });
  document.getElementById("total").innerText = total;
}

function checkout() {
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;

  if(!name || !phone) {
    alert("Заповни всі поля!");
    return;
  }

  let text = "Замовлення:\n";
  cart.forEach(item => {
    text += item.name + " - " + item.price + " грн\n";
  });

  text += "Сума: " + total + " грн\n";
  text += "Ім'я: " + name + "\nТелефон: " + phone;

  alert(text);
}
</script>

</body>
</html>
