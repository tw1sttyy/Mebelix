<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxury Furniture</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
}

header {
  background: linear-gradient(90deg, #000, #1a1a1a);
  padding: 20px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 2px;
}

.catalog {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  padding: 30px;
  gap: 25px;
}

.card {
  background: #1a1a1a;
  border-radius: 15px;
  overflow: hidden;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
  box-shadow: 0 0 25px rgba(255,255,255,0.2);
}

.card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
}

.card-content {
  padding: 15px;
}

.price {
  color: #00ffcc;
  font-size: 18px;
  margin: 10px 0;
}

button {
  width: 100%;
  padding: 10px;
  border: none;
  background: #00ffcc;
  color: black;
  font-weight: bold;
  cursor: pointer;
  border-radius: 8px;
}

button:hover {
  background: #00cca3;
}

footer {
  text-align: center;
  padding: 30px;
  background: #000;
  margin-top: 20px;
}

.telegram {
  display: inline-block;
  margin-top: 10px;
  color: #00ffcc;
  text-decoration: none;
  font-weight: bold;
}
</style>

</head>

<body>

<header>
🪑 LUXURY FURNITURE
</header>

<section class="catalog">

<div class="card">
<img src="https://images.unsplash.com/photo-1582582494700-7c3c1c9c1f8c">
<div class="card-content">
<h3>Сучасний диван</h3>
<p class="price">12 500 грн</p>
<button onclick="buy('Сучасний диван')">Купити</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1598300056391-5c8dc9b6e0c5">
<div class="card-content">
<h3>Дерев'яний стіл</h3>
<p class="price">8 200 грн</p>
<button onclick="buy('Дерев'яний стіл')">Купити</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1616627450811-46c9b3f0f979">
<div class="card-content">
<h3>Крісло преміум</h3>
<p class="price">6 900 грн</p>
<button onclick="buy('Крісло преміум')">Купити</button>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c">
<div class="card-content">
<h3>Ліжко люкс</h3>
<p class="price">15 000 грн</p>
<button onclick="buy('Ліжко люкс')">Купити</button>
</div>
</div>

</section>

<footer>
<p>Засновник: Сергій</p>
<a class="telegram" href="https://t.me/aasdd130" target="_blank">
📩 Перейти в Telegram
</a>
</footer>

<script>
function buy(product) {
  const message = `Привіт! Хочу замовити: ${product}`;
  const url = `https://t.me/aasdd130?text=${encodeURIComponent(message)}`;
  window.open(url, "_blank");
}
</script>

</body>
</html>
