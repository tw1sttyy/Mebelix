<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mebelix</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #f4f4f4;
}

header {
  background: #111;
  color: white;
  padding: 15px;
  text-align: center;
}

.search {
  text-align: center;
  padding: 10px;
}

.search input {
  width: 80%;
  padding: 10px;
  font-size: 16px;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
  text-align: center;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.03);
}

.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.price {
  color: green;
  font-size: 18px;
}

button {
  margin: 10px;
  padding: 10px;
  border: none;
  background: #ff6600;
  color: white;
  border-radius: 5px;
  cursor: pointer;
}

.cart {
  background: white;
  margin: 20px;
  padding: 15px;
  border-radius: 10px;
}

footer {
  background: #111;
  color: white;
  text-align: center;
  padding: 10px;
}
</style>
</head>

<body>

<header>
  <h1>🛋️ Mebelix</h1>
  <p>Інтернет-магазин меблів</p>
</header>

<div class="search">
  <input type="text" id="search" placeholder="Пошук..." onkeyup="filter()">
</div>

<div class="container" id="products"></div>

<div class="cart">
  <h2>🛒 Корзина</h2>
  <ul id="cartList"></ul>
  <h3>Сума: <span id="total">0</span> грн</h3>

  <input type="text" id="name" placeholder="Ваше ім’я">
  <input type="text" id="phone" placeholder="Телефон">

  <button onclick="checkout()">Замовити</button>
</div>

<footer>
  <p>📞 +38066666666</p>
</footer>

<script>
const TOKEN = "ТВОЙ_TOKEN";
const CHAT_ID = "ТВОЙ_CHAT_ID";

let cart = [];
let total = 0;

const products = [
  {name:"Диван Modern", price:12000, img:"https://images.unsplash.com/photo-1586023492125-27b2c045efd7"},
  {name:"Крісло Comfort", price:4500, img:"https://images.unsplash.com/photo-1616627981456-76e89f64c6df"},
  {name:"Стіл Wood", price:6800, img:"https://images.unsplash.com/photo-1555041469-a586c61ea9bc"},
  {name:"Ліжко King", price:15000, img:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85"},
  {name:"Шафа Classic", price:9000, img:"https://images.unsplash.com/photo-1615874959474-d609969a20ed"},
  {name:"Комод Style", price:5200, img:"https://images.unsplash.com/photo-1598300053653-9f6a8b6c7c2c"},
  {name:"Полиця Loft", price:2400, img:"https://images.unsplash.com/photo-1588854337118-1c2d9247b3f2"},
  {name:"Стілець Soft", price:1800, img:"https://images.unsplash.com/photo-1582582429416-54f1f28b74c3"},
  {name:"Тумба Bedside", price:3000, img:"https://images.unsplash.com/photo-1595526114035-0d45ed16cfbf"},
  {name:"Офісне крісло Pro", price:7200, img:"https://images.unsplash.com/photo-1598300042247-d088f8ab3a91"}
];

function renderProducts(list = products) {
  const container = document.getElementById("products");
  container.innerHTML = "";
  list.forEach(p => {
    container.innerHTML += `
      <div class="card">
        <img src="${p.img}">
        <h3>${p.name}</h3>
        <p class="price">${p.price} грн</p>
        <button onclick="addToCart('${p.name}', ${p.price})">В корзину</button>
      </div>
    `;
  });
}

function filter() {
  const val = document.getElementById("search").value.toLowerCase();
  const filtered = products.filter(p => p.name.toLowerCase().includes(val));
  renderProducts(filtered);
}

function addToCart(name, price) {
  cart.push({name, price});
  total += price;
  renderCart();
}

function renderCart() {
  let list = document.getElementById("cartList");
  list.innerHTML = "";
  cart.forEach(item => {
    let li = document.createElement("li");
    li.innerText = item.name + " - " + item.price + " грн";
    list.appendChild(li);
  });
  document.getElementById("total").innerText = total;
}

function checkout() {
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;

  if(!name || !phone) {
    alert("Заповни всі поля!");
    return;
  }

  let message = "🛒 Замовлення:%0A";
  cart.forEach(item => {
    message += item.name + " - " + item.price + " грн%0A";
  });

  message += "%0A💰 Сума: " + total + " грн%0A";
  message += "👤 " + name + "%0A📞 " + phone;

  fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${message}`)
    .then(() => alert("Відправлено 🚀"));
}

renderProducts();
</script>

</body>
</html>
